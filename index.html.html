<div id="app"></div>

<style>
  :root{
    --ink:#1a1a1a;
    --paper:#faf9f6;
    --line:#e2ddd2;
    --accent:#6a4c93;
  }
  *{box-sizing:border-box;}
  #app{
    font-family: ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
    background: var(--paper);
    color: var(--ink);
    padding: 30px 24px 34px;
    border-radius: 14px;
    max-width: 480px;
    margin: 0 auto;
  }
  .qmark{
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 6px;
  }
  h1{
    font-size: 21px;
    font-weight: 650;
    line-height: 1.35;
    margin: 0 0 22px;
    letter-spacing: -0.01em;
  }
  textarea{
    width: 100%;
    min-height: 88px;
    padding: 12px 13px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    font-size: 14.5px;
    font-family: inherit;
    background: #fff;
    color: var(--ink);
    resize: vertical;
  }
  textarea:focus{
    outline: none;
    border-color: var(--accent);
  }
  .anon-note{
    font-size: 11.5px;
    color: #8a8471;
    margin: 6px 0 14px;
  }
  button.submit{
    width: 100%;
    padding: 11px;
    border: none;
    border-radius: 9px;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button.submit:hover{ background: #5a3f7f; }
  button.submit:disabled{ opacity: 0.5; cursor: default; }
  .status{
    font-size: 12.5px;
    margin-top: 8px;
    min-height: 16px;
  }
  .status.ok{ color: #1e6b3c; }
  .status.err{ color: #922b21; }
  .divider{
    border: none;
    border-top: 1px solid var(--line);
    margin: 26px 0 18px;
  }
  .list-title{
    font-size: 12.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #7a7568;
    margin: 0 0 12px;
  }
  .answer{
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 11px 13px;
    margin-bottom: 9px;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .empty{
    font-size: 13px;
    color: #9a9484;
    font-style: italic;
  }
  .loading{
    font-size: 13px;
    color: #9a9484;
  }
</style>

<script>
(function(){
  const QUESTION = "Τι νιώθεις, ξεχωριστά, για τη μητέρα σου και για τον πατέρα σου;";
  const BIN_ID = "6aaaac0cac6210605ad4ef5d";
  const MASTER_KEY = "$2a$10$zpk8BdACqir6ee6fPv6B3ut7cdho9YJ8WO3K7dN96hf302NKfFWDu";
  const API_BASE = "https://api.jsonbin.io/v3/b/" + BIN_ID;

  const app = document.getElementById('app');
  app.innerHTML = `
    <p class="qmark">Ανώνυμη ερώτηση</p>
    <h1>${QUESTION}</h1>
    <textarea id="answerInput" placeholder="π.χ. Για τη μητέρα: ...&#10;Για τον πατέρα: ..."></textarea>
    <p class="anon-note">Η απάντησή σου δεν συνδέεται με το όνομά σου — είναι εντελώς ανώνυμη.</p>
    <button class="submit" id="submitBtn">Υποβολή απάντησης</button>
    <div class="status" id="status"></div>
    <hr class="divider">
    <p class="list-title">Απαντήσεις</p>
    <div id="answersList" class="loading">Φόρτωση...</div>
  `;

  const input = document.getElementById('answerInput');
  const submitBtn = document.getElementById('submitBtn');
  const statusEl = document.getElementById('status');
  const listEl = document.getElementById('answersList');

  function renderAnswers(answers){
    if(!answers.length){
      listEl.innerHTML = '<div class="empty">Δεν υπάρχουν ακόμα απαντήσεις.</div>';
      return;
    }
    listEl.innerHTML = answers
      .slice()
      .reverse()
      .map(a => `<div class="answer">${escapeHtml(a.text)}</div>`)
      .join('');
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  async function loadAnswers(){
    try{
      const res = await fetch(API_BASE + "/latest", {
        headers: { "X-Master-Key": MASTER_KEY }
      });
      const data = await res.json();
      const record = data.record;
      const answers = Array.isArray(record) ? record : (record && record.answers) || [];
      renderAnswers(answers);
      return answers;
    }catch(e){
      listEl.innerHTML = '<div class="empty">Δεν ήταν δυνατή η φόρτωση των απαντήσεων.</div>';
      return [];
    }
  }

  async function saveAnswers(answers){
    await fetch(API_BASE, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        "X-Master-Key": MASTER_KEY
      },
      body: JSON.stringify({ answers: answers })
    });
  }

  async function submitAnswer(){
    const text = input.value.trim();
    if(!text){
      statusEl.className = 'status err';
      statusEl.textContent = 'Γράψε κάτι πριν την υποβολή.';
      return;
    }
    submitBtn.disabled = true;
    statusEl.className = 'status';
    statusEl.textContent = 'Αποστολή...';
    try{
      const current = await loadAnswers();
      const updated = current.concat([{ text: text, ts: Date.now() }]);
      await saveAnswers(updated);
      renderAnswers(updated);
      input.value = '';
      statusEl.className = 'status ok';
      statusEl.textContent = 'Η απάντησή σου καταχωρήθηκε ανώνυμα ✓';
    }catch(e){
      statusEl.className = 'status err';
      statusEl.textContent = 'Κάτι πήγε στραβά, δοκίμασε ξανά.';
    }finally{
      submitBtn.disabled = false;
    }
  }

  submitBtn.addEventListener('click', submitAnswer);
  loadAnswers();
})();
</script>
